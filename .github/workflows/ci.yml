name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: "23.1.3"

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DDML_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: pip install "clang-format==${{ env.CLANG_FORMAT_VERSION }}"

      - name: Check formatting
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target check-format

  variants:
    name: ${{ matrix.variant.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: shared
            args: -DDML_BUILD_TYPE=SHARED
          - name: no-tests
            args: -DDML_USE_TESTS=OFF
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DDML_WARNINGS_AS_ERRORS=ON
          ${{ matrix.variant.args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        if: matrix.variant.name == 'shared'
        run: ctest --test-dir build --output-on-failure

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [build, format, variants]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          results="${{ needs.build.result }} ${{ needs.format.result }} ${{ needs.variants.result }}"
          echo "job results: $results"
          if [ "$results" != "success success success" ]; then
            echo "::error::at least one required job did not pass"
            exit 1
          fi
